<!--
  ================================================================
  TEMAS (variables semánticas)
  Cada vista tiene su paleta. Los colores se escriben como "R G B" para que
  Tailwind pueda aplicar opacidad (bg-primary/20). Para cambiar el verde o el
  azul, edita SOLO el bloque de la vista correspondiente.
  ================================================================
-->
<style>
  /* Layout: header y footer fijos; el contenido cambia entre Inicio y dos catálogos. */
  :root {
    /* Color de cada rama, constante en todas las vistas (vista previa en las tarjetas de Inicio).
       Mantenerlos iguales a --primary de su vista. */
    --branch-agriculture: 63 107 69;      /* #3F6B45 */
    --branch-organizational: 37 99 235;   /* #2563eb */
  }
  :root,
  [data-view="home"] {             /* Inicio: monocromático (blanco y negro) */
    --bg: 250 250 249;
    --surface: 255 255 255;
    --ink: 12 12 12;
    --muted: 87 87 84;
    --line: 12 12 12;
    --primary: 12 12 12;
    --primary-strong: 0 0 0;
    --primary-soft: 236 236 233;
    --on-primary: 255 255 255;
    --deep: 12 12 12;
    --on-deep: 245 245 244;
    --deep-muted: 168 168 162;
    --deep-accent: 214 214 209;    /* títulos dentro del footer */
    color-scheme: light;
  }
  [data-view="agriculture"] {      /* Insumos Agrícolas: paleta verde actual */
    --bg: 243 246 241;
    --surface: 253 254 252;
    --ink: 21 32 27;
    --muted: 77 90 83;
    --line: 24 48 36;
    --primary: 63 107 69;          /* #3F6B45 */
    --primary-strong: 28 70 52;    /* #1C4634 */
    --primary-soft: 225 235 227;   /* #E1EBE3 */
    --on-primary: 255 255 255;
    --deep: 14 36 25;              /* #0E2419 */
    --on-deep: 232 240 234;
    --deep-muted: 169 189 177;
    --deep-accent: 169 211 181;    /* #A9D3B5 */
  }
  [data-view="organizational"] {   /* Insumos Institucionales: misma paleta con azul #2563eb */
    --bg: 243 245 249;
    --surface: 253 253 255;
    --ink: 17 24 39;
    --muted: 75 85 99;
    --line: 17 24 39;
    --primary: 37 99 235;          /* #2563eb */
    --primary-strong: 30 64 175;   /* #1e40af */
    --primary-soft: 219 234 254;   /* #dbeafe */
    --on-primary: 255 255 255;
    --deep: 11 26 58;              /* #0b1a3a */
    --on-deep: 232 238 250;
    --deep-muted: 165 180 210;
    --deep-accent: 165 196 245;
  }

  /* Tipografía del proyecto (archivos locales) */
  @font-face { font-family: "Clash Display"; src: url("assets/fonts/clash-display-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Clash Display"; src: url("assets/fonts/clash-display-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }

  html { scroll-behavior: smooth; scroll-padding-top: 8.5rem; }
  body {
    margin: 0;
    background: rgb(var(--bg));
    color: rgb(var(--ink));
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .5s ease-in-out, color .5s ease-in-out;
  }
  h1, h2, h3 { text-wrap: balance; }
  .font-display { word-spacing: .08em; }   /* Clash Display junta las palabras con tracking negativo */
  p { text-wrap: pretty; }

  /* Entrada de cada vista */
  @keyframes view-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .view-enter { animation: view-in .5s ease-in-out both; }

  /* Marquesina de proveedores (pausa con el botón, el cursor o el foco) */
  @keyframes marquee { to { transform: translateX(calc(-50% - 0.5rem)); } }
  .marquee-mask { -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .marquee-track { animation: marquee 40s linear infinite; }
  .marquee-mask:hover .marquee-track, .marquee-mask:focus-within .marquee-track, .marquee-mask.is-paused .marquee-track { animation-play-state: paused; }

  @media (prefers-reduced-motion: reduce) {
    .marquee-track { animation: none; flex-wrap: wrap; justify-content: center; width: auto; }
    .marquee-track > [aria-hidden="true"] { display: none; }
    .marquee-mask { -webkit-mask-image: none; mask-image: none; }
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

</script>

/* ================================================================
   Utilidades
   ================================================================ */
const { useState, useEffect, useRef, useCallback } = React;

const waUrl = (message) =>
  "https://wa.me/" + DATA.site.whatsapp.number + "?text=" + encodeURIComponent(message || DATA.site.whatsapp.defaultMessage);

function productMessage(product, categoryName) {
  const vars = { name: product.name, reference: product.reference, presentation: product.presentation, category: categoryName };
  return DATA.site.whatsapp.productMessageTemplate
    .map((line) => {
      let skip = false;
      const filled = line.replace(/\{(\w+)\}/g, (_, k) => {
        const v = (vars[k] || "").trim();
        if (!v) skip = true;
        return v;
      });
      return skip ? null : filled;
    })
    .filter(Boolean)
    .join("\n");
}

const productsOf = (categoryId) => DATA.products.filter((p) => p.category === categoryId);
const mapsUrl = () => {
  const a = DATA.site.address;
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([a.street, a.city, a.region, a.country].join(", "));
};
const prefersReducedMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Transición de colores compartida (cambio de tema) */
const T = "transition-colors duration-500 ease-in-out";

/* ================================================================
   Componentes base
   ================================================================ */
function Icon({ name, className = "h-5 w-5" }) {
  return (
    <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false" className={className}
      dangerouslySetInnerHTML={{ __html: ICONS[name] || "" }} />
  );
}

function WhatsAppButton({ message, label = "Escríbenos", ariaLabel, size = "md", block = false, light = false }) {
  const sizes = size === "sm" ? "h-11 pl-4 pr-1.5 text-sm" : "h-12 pl-5 pr-1.5 text-[0.95rem]";
  const colors = light ? "bg-bg text-ink hover:bg-surface" : "bg-primary text-primary-fg hover:bg-primary-strong";
  return (
    <a href={waUrl(message)} target="_blank" rel="noopener noreferrer" aria-label={ariaLabel}
      className={`group inline-flex items-center justify-between gap-3 rounded-full font-semibold ${colors}
        ${sizes} ${block ? "w-full" : ""} ${T} active:scale-[.98]
        focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/30`}>
      <span>{label}</span>
      <span className={`grid h-9 w-9 place-items-center rounded-full ${light ? "bg-ink/10" : "bg-white/15"} transition-transform duration-500 group-hover:translate-x-0.5 group-hover:-translate-y-px`}>
        <Icon name="whatsapp" className="h-[18px] w-[18px]" />
      </span>
    </a>
  );
}

/* ================================================================
   Header fijo: logo + selector de vista + WhatsApp
   ================================================================ */
const NAV = [
  { view: "home", label: "Inicio" },
  { view: "agriculture", label: "Agrícolas" },
  { view: "organizational", label: "Institucionales" },
];

function Header({ view, onNavigate }) {
  return (
    <header className="fixed inset-x-0 top-0 z-40 px-3 pt-[calc(env(safe-area-inset-top,0px)+10px)]">
      <div className={`mx-auto flex max-w-6xl flex-wrap items-center gap-x-3 gap-y-2 rounded-[1.75rem] border border-line/10
        bg-surface/80 px-3 py-2 shadow-[0_10px_30px_-18px_rgb(var(--line)/.45)] backdrop-blur-xl ${T} md:flex-nowrap md:rounded-full`}>
        <button type="button" onClick={() => onNavigate("home")} aria-label={DATA.site.name + ", inicio"}
          className="mr-auto rounded-full px-2 py-1 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/30">
          <img src={DATA.site.logo} alt={DATA.site.name} width="307" height="107" className="h-9 w-auto md:h-10" />
        </button>

        <nav aria-label="Secciones" className="order-last w-full md:order-none md:w-auto">
          <ul className={`grid grid-cols-[1fr_1fr_1.35fr] gap-1 rounded-full bg-ink/[.05] p-1 ${T} md:grid-cols-3`}>
            {NAV.map((item) => {
              const active = view === item.view;
              return (
                <li key={item.view}>
                  <button type="button" onClick={() => onNavigate(item.view)} aria-current={active ? "page" : undefined}
                    className={`w-full whitespace-nowrap rounded-full px-2 py-2 text-[0.8125rem] font-medium ${T} sm:text-sm md:px-4
                      focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/30
                      ${active ? "bg-primary text-primary-fg shadow-sm" : "text-muted hover:bg-surface hover:text-ink"}`}>
                    {item.label}
                  </button>
                </li>
              );
            })}
          </ul>
        </nav>

        <div className="hidden md:block">
          <WhatsAppButton size="sm" ariaLabel="Escríbenos por WhatsApp" />
        </div>
      </div>
    </header>
  );
}

/* ================================================================
   Proveedores: cinta de logos (visible en todas las vistas)
   ================================================================ */
function ProviderChip({ p, hidden }) {
  const inner = p.logo
    ? <img src={p.logo} alt={hidden ? "" : p.name} className="h-11 w-auto max-w-[150px] rounded-md object-contain transition-transform duration-500 group-hover:scale-105" />
    : <span className={`whitespace-nowrap font-display text-lg font-semibold text-muted ${T}`}>{p.name}</span>;
  return (
    <li aria-hidden={hidden ? "true" : undefined}>
      <div className={`group flex h-24 min-w-[220px] items-center justify-center gap-3 rounded-full bg-surface px-8 shadow-[0_0_0_1px_rgb(var(--line)/.08)] ${T}`}>
        {inner}
        {p.placeholder && (
          <span className={`rounded-full px-2.5 py-0.5 text-xs font-medium text-muted ring-1 ring-inset ring-current ${T}`}>Ejemplo</span>
        )}
      </div>
    </li>
  );
}

function ProvidersBand({ id }) {
  const [paused, setPaused] = useState(false);
  return (
    <section id={id} aria-labelledby="providers-title" className={`bg-primary/10 py-14 md:py-16 ${T}`}>
      <h2 id="providers-title" className={`mb-8 text-center font-display text-xl font-medium text-primary ${T} md:text-2xl`}>
        Marcas con las que trabajamos
      </h2>
      <div id="providers-marquee" className={`marquee-mask overflow-hidden ${paused ? "is-paused" : ""}`}>
        <ul className="marquee-track flex w-max gap-4 py-1.5">
          {DATA.providers.map((p) => <ProviderChip key={p.name} p={p} />)}
          {DATA.providers.map((p) => <ProviderChip key={p.name + "-copia"} p={p} hidden />)}
        </ul>
      </div>
      <div className="mt-5 flex justify-center motion-reduce:hidden">
        <button type="button" onClick={() => setPaused(!paused)} aria-pressed={paused} aria-controls="providers-marquee"
          className={`inline-flex h-10 items-center gap-2 rounded-full bg-surface/60 px-4 text-[0.8125rem] font-medium text-primary
            shadow-[0_0_0_1px_rgb(var(--line)/.08)] ${T} hover:bg-surface focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/30`}>
          <Icon name={paused ? "play" : "pause"} className="h-4 w-4" />
          {paused ? "Reanudar animación" : "Pausar animación"}
        </button>
      </div>
    </section>
  );
}

/* ================================================================
   Footer original: panel oscuro de 3 columnas (desplegables en móvil)
   ================================================================ */
function useIsDesktop(query = "(min-width: 700px)") {
  const [is, setIs] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query);
    const on = (e) => setIs(e.matches);
    mq.addEventListener("change", on);
    return () => mq.removeEventListener("change", on);
  }, [query]);
  return is;
}

function FooterColumn({ title, children, desktop }) {
  const [open, setOpen] = useState(false);
  const isOpen = desktop || open;
  const panelId = "footer-" + title.toLowerCase().replace(/\W+/g, "-");
  return (
    <div className={desktop ? "" : `border-t border-white/10 ${T}`}>
      {desktop ? (
        <p className={`mb-3 text-xs font-medium uppercase tracking-[0.14em] text-deep-accent ${T}`}>{title}</p>
      ) : (
        <button type="button" onClick={() => setOpen(!open)} aria-expanded={open} aria-controls={panelId}
          className={`flex min-h-[52px] w-full items-center justify-between py-3.5 text-xs font-medium uppercase tracking-[0.14em] text-deep-accent ${T}
            focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-deep-accent`}>
          {title}
          <Icon name="arrow" className={`h-4 w-4 transition-transform duration-500 ${open ? "-rotate-90" : "rotate-90"}`} />
        </button>
      )}
      <div id={panelId} hidden={!isOpen} className={desktop ? "" : "pb-5"}>{children}</div>
    </div>
  );
}

          className={`h-full w-full ${fit}`} />

/* ================================================================
   App: estado de la vista + transiciones
   ================================================================ */
function App() {
  const [view, setView] = useState("home");          // vista pedida (controla el tema)
  const [shown, setShown] = useState("home");        // vista renderizada (cambia tras la salida)
  const [leaving, setLeaving] = useState(false);
  const headingRef = useRef(null);
  const firstRender = useRef(true);
  const timer = useRef(null);

  /* El tema vive en <html data-view>: cambia header, footer y contenido a la vez */
  useEffect(() => { document.documentElement.dataset.view = view; }, [view]);

  const navigate = useCallback((next) => {
    if (next === view) return;
    setView(next);
    clearTimeout(timer.current);
    if (prefersReducedMotion()) { setShown(next); return; }
    setLeaving(true);                                  // salida: desvanecer
    timer.current = setTimeout(() => {                 // montaje de la nueva vista
      setShown(next);
      setLeaving(false);
    }, 220);
  }, [view]);

  /* Desplazar a una sección persistente (proveedores, contacto) sin cambiar de vista */
  const scrollToId = useCallback((id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "start" });
  }, []);

  /* Al montar una vista: subir al inicio y mover el foco al título (lectores de pantalla) */
  useEffect(() => {
    if (firstRender.current) { firstRender.current = false; return; }
    window.scrollTo({ top: 0, behavior: "auto" });
    headingRef.current && headingRef.current.focus({ preventScroll: true });
  }, [shown]);

  return (
    <>
      <a href="#main" className="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-ink focus:px-4 focus:py-2 focus:text-bg">
        Saltar al contenido
      </a>
      <Header view={view} onNavigate={navigate} />

      <main id="main"
        className="mx-auto max-w-6xl px-4 pb-20 pt-[calc(env(safe-area-inset-top,0px)+9.5rem)] sm:px-6 md:pb-24 md:pt-[calc(env(safe-area-inset-top,0px)+7.5rem)] lg:px-8">
        <div key={shown} className={`view-enter transition-opacity duration-200 ease-in-out ${leaving ? "opacity-0" : "opacity-100"}`}>
          {shown === "home"
            ? <HomeView onOpen={navigate} headingRef={headingRef} />
            : <CatalogView branchKey={shown} onNavigate={navigate} headingRef={headingRef} />}
        </div>
      </main>

      {/* Persistentes en todas las vistas */}
      <ProvidersBand id="proveedores" />
      <Footer onNavigate={navigate} onScrollTo={scrollToId} />

      {/* Botón flotante de WhatsApp */}
      <a href={waUrl()} target="_blank" rel="noopener noreferrer" aria-label="Escríbenos por WhatsApp"
        className={`fixed bottom-[calc(env(safe-area-inset-bottom,0px)+1rem)] right-4 z-40 grid h-14 w-14 place-items-center rounded-full
          bg-primary text-primary-fg shadow-[0_12px_28px_-10px_rgb(var(--primary)/.7)] ${T} hover:scale-105 hover:bg-primary-strong
          focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/40 md:right-6`}>
        <Icon name="whatsapp" className="h-7 w-7" />
      </a>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
